name: PR Check

on:
  pull_request:
    branches: [dev]

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 574667603029.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: roundflow

jobs:
  check:
    name: Install → Test → Build image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/tenant/schema.prisma

      - name: Run tests
        run: npm test

      - name: Build Docker image (no push)
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          docker build -t $IMAGE:pr-${{ github.sha }} .
